<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=160">
<meta name="ad.size" content="width=160,height=600">
<title>Stock-Market-Predictor — Wide Skyscraper 160x600</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 160px; height: 600px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .ad {
    width: 160px; height: 600px;
    background: linear-gradient(180deg, #002b36 0%, #073642 55%, #002b36 100%);
    display: flex; flex-direction: column; align-items: center;
    padding: 26px 16px;
    border: 1px solid #586e75;
    cursor: pointer;
    text-decoration: none; color: inherit;
    text-align: center;
  }
  .logo {
    width: 60px; height: 60px;
    background: #268bd2; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; color: #fdf6e3; font-weight: 700;
    margin-bottom: 22px;
  }
  h2 { font-size: 20px; color: #93a1a1; font-weight: 700; letter-spacing: -0.3px; line-height: 1.25; }
  p { font-size: 12px; color: #839496; margin-top: 14px; line-height: 1.5; }
  ul { list-style: none; margin-top: 18px; }
  li { font-size: 11px; color: #839496; margin-top: 8px; padding-top: 8px; border-top: 1px solid #0b4a58; }
  .cta {
    background: #268bd2; color: #fdf6e3;
    padding: 11px 16px; border-radius: 6px;
    font-size: 13px; font-weight: 600;
    margin-top: auto;
    display: inline-block;
  }
</style>
</head>
<body>
  <a class="ad" href="https://github.com/andytischen/Stock-Market-Predictor" target="_blank" rel="noopener">
    <div class="logo">&uarr;%</div>
    <h2>Know the open<br>before the bell</h2>
    <p>Up-gap odds for 16 global indices, from the signals the market leaves overnight.</p>
    <ul>
      <li>VIX &amp; volatility</li>
      <li>Treasury yields</li>
      <li>FX &amp; the dollar</li>
      <li>Oil, gold, copper</li>
      <li>Overnight futures</li>
    </ul>
    <div class="cta">Predict the open &rarr;</div>
  </a>
</body>
</html>
