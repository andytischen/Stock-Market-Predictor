<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=728">
<meta name="ad.size" content="width=728,height=90">
<title>Stock-Market-Predictor — Leaderboard 728x90</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 728px; height: 90px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .ad {
    width: 728px; height: 90px;
    background: linear-gradient(100deg, #002b36 0%, #073642 55%, #002b36 100%);
    display: flex; align-items: center;
    padding: 0 22px;
    border: 1px solid #586e75;
    cursor: pointer;
    text-decoration: none; color: inherit;
  }
  .logo {
    width: 52px; height: 52px; flex: 0 0 52px;
    background: #268bd2; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #fdf6e3; font-weight: 700;
    margin-right: 20px;
  }
  .text { flex: 1; }
  h2 { font-size: 20px; color: #93a1a1; font-weight: 700; letter-spacing: -0.3px; }
  p { font-size: 13px; color: #839496; margin-top: 3px; }
  .cta {
    flex: 0 0 auto;
    background: #268bd2; color: #fdf6e3;
    padding: 12px 26px; border-radius: 6px;
    font-size: 15px; font-weight: 600;
    margin-left: 20px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <a id="ad" class="ad" href="https://github.com/andytischen/Stock-Market-Predictor" target="_blank" rel="noopener">
    <div class="logo">&uarr;%</div>
    <div class="text">
      <h2>Know the market before it opens</h2>
      <p>Up-gap probability for 16 global indices from VIX, yields, FX &amp; commodities — no look-ahead bias.</p>
    </div>
    <div class="cta">Predict the open &rarr;</div>
  </a>
  <script>
    // Support ad-server clickTag while defaulting to the repo for static previews.
    (function () {
      var fallback = "https://github.com/andytischen/Stock-Market-Predictor";
      var url = (typeof clickTag !== "undefined" && clickTag) || fallback;
      document.getElementById("ad").setAttribute("href", url);
    })();
  </script>
</body>
</html>
